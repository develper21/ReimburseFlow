# Netlify Configuration for ReimburseFlow Frontend
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_EXCHANGE_API_KEY,VITE_RESTCOUNTRIES_URL,VITE_API_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,Docs/**,README.md"

# SPA routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
