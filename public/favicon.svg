<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd366e" />
      <stop offset="50%" stop-color="#f02e65" />
      <stop offset="100%" stop-color="#fe9567" />
    </linearGradient>
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with dark Appwrite obsidian fill -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle glowing radial mesh in center -->
  <circle cx="32" cy="32" r="22" fill="#fd366e" opacity="0.18" />

  <!-- Flowing Geometric ReimburseFlow Emblem (Interlocking loops with gradient) -->
  <g filter="url(#neon-blur)">
    <!-- Top-left to bottom-right flow wave -->
    <path d="M16 26C16 19.3726 21.3726 14 28 14H36C42.6274 14 48 19.3726 48 26C48 31 44.5 35 40 37L24 43C19.5 45 16 49 16 54" stroke="url(#rf-glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Currency flow dot & ring -->
    <circle cx="44" cy="44" r="5" fill="url(#rf-glow)" />
    <path d="M22 28L32 20L42 28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>
</svg>
